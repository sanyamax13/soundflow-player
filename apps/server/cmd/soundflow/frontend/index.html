<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoundFlow</title>
<style>
  :root{
    --bg:#fff; --head:#fafafa; --field:#f4f4f5; --limebox:#f0fbd6;
    --ink:#18181b; --mut:#71717a; --faint:#a1a1aa; --line:#e4e4e7;
    --lime:#b2ff00; --lime-ink:#0a0a0a; --ok:#3f9e1e; --err:#d13a30; --warn:#b98900;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{font-family:Inter,"Segoe UI",system-ui,sans-serif; color:var(--ink);
    background:var(--bg); display:flex; flex-direction:column; overflow:hidden}

  .top{height:52px; background:var(--head); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; padding:0 16px; flex-shrink:0}
  .logo{width:28px; height:28px; border-radius:8px; background:var(--lime);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; color:var(--lime-ink)}
  .brand{font-weight:800; font-size:15px}
  .top .sp{flex:1}
  .pill{display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600;
    color:var(--ok); background:#f1f9ec; border:1px solid #d5ead0; padding:5px 10px; border-radius:999px}
  .pill .dot{width:8px; height:8px; border-radius:50%; background:var(--ok)}
  .pill.off{color:var(--warn); background:#fbf6e8; border-color:#eadfc4}
  .pill.off .dot{background:var(--warn)}
  .addr{font-size:13px; font-weight:700; background:var(--limebox); border:1px solid var(--line);
    padding:6px 11px; border-radius:8px; cursor:pointer}
  .disk{font-size:12px; color:var(--mut)}

  .body{flex:1; display:flex; min-height:0}
  .nav{width:140px; border-right:1px solid var(--line); padding:12px 8px; display:flex; flex-direction:column; gap:2px; flex-shrink:0}
  .nav a{font-size:13px; color:var(--mut); padding:8px 11px; border-radius:8px; font-weight:600; cursor:pointer; position:relative}
  .nav a.on{color:var(--ink); background:var(--field)}
  .nav a.on::before{content:""; position:absolute; left:0; top:7px; bottom:7px; width:3px; border-radius:2px; background:var(--lime)}
  .nav .gap{flex:1}
  .nav .ver{font-size:10px; color:var(--faint); padding:0 11px}

  .main{flex:1; display:flex; flex-direction:column; min-width:0}
  .center{flex:1; display:flex; min-height:0}
  .pane{flex:1; display:flex; flex-direction:column; min-width:0; padding:14px 16px}

  .bar{display:flex; align-items:center; gap:8px; margin-bottom:10px}
  .search{flex:1; height:32px; border:1px solid var(--line); border-radius:8px; background:var(--field);
    padding:0 11px; font-size:13px}
  .btn{height:32px; padding:0 13px; border-radius:8px; font-size:12px; font-weight:700; border:1px solid var(--line);
    background:#fff; color:var(--ink); cursor:pointer; white-space:nowrap}
  .btn.primary{background:var(--lime); border-color:var(--lime); color:var(--lime-ink)}
  .btn.danger{color:var(--err); border-color:#eecccb}
  .btn:disabled{opacity:.45; cursor:default}

  .sum{font-size:12px; color:var(--mut); margin-bottom:9px}
  .sum b{color:var(--ink)}

  .tree{flex:1; border:1px solid var(--line); border-radius:10px; overflow:auto}
  .row{display:flex; align-items:center; gap:7px; height:32px; padding:0 10px; font-size:12.5px;
    border-bottom:1px solid var(--line); white-space:nowrap; cursor:default}
  .row:last-child{border-bottom:none}
  .row .tw{width:12px; color:var(--faint); font-size:10px; cursor:pointer; text-align:center}
  .row .ico{width:16px; text-align:center}
  .row .nm{overflow:hidden; text-overflow:ellipsis}
  .row .sp{flex:1}
  .row .meta{color:var(--mut); font-size:11px}
  .row.root{background:var(--head); font-weight:700}
  .row.artist,.row.folder{font-weight:600}
  .row.track{color:var(--mut); font-size:12px; height:29px}
  .row.track .ti{color:var(--ink)}
  .fp{font-size:10.5px; font-weight:800}
  .fp.full{color:var(--ok)} .fp.part{color:var(--warn)} .fp.none{color:var(--faint)}
  .yes{color:var(--ok); font-weight:800} .no{color:var(--faint); font-weight:800}
  .muted{color:var(--faint); font-size:12px; padding:16px}

  .side{width:300px; border-left:1px solid var(--line); padding:14px 14px; display:flex; flex-direction:column; gap:16px; flex-shrink:0; overflow:auto}
  .card h4{font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); margin-bottom:8px}
  .dev{display:flex; align-items:center; gap:9px; padding:7px 0; border-bottom:1px solid var(--line)}
  .dev:last-child{border-bottom:none}
  .dev .ic{width:24px; height:24px; border-radius:6px; background:var(--field); display:flex; align-items:center; justify-content:center; font-size:12px}
  .dev .nm{font-size:12px; font-weight:600}
  .dev .m{font-size:10.5px; color:var(--mut)}
  .dev .sp{flex:1}
  .job .lbl{display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:4px}
  .job .lbl span:last-child{color:var(--mut)}
  .track2{height:6px; border-radius:3px; background:var(--field); overflow:hidden}
  .track2>i{display:block; height:100%; background:var(--lime)}

  .log{height:150px; border-top:1px solid var(--line); background:#fcfcfc; display:flex; flex-direction:column; flex-shrink:0}
  .log .lh{display:flex; align-items:center; gap:7px; padding:7px 15px; font-size:10.5px; text-transform:uppercase;
    letter-spacing:.04em; color:var(--mut); border-bottom:1px solid var(--line)}
  .log .lh .dot{width:6px; height:6px; border-radius:50%; background:var(--lime)}
  .log .rows{flex:1; overflow:auto; padding:7px 15px; font-family:ui-monospace,Consolas,monospace; font-size:11px; line-height:1.7}
  .log .t{color:var(--faint)}
  .log .k{display:inline-block; min-width:64px; font-weight:700}
  .k.info{color:#2563eb} .k.error{color:var(--err)} .k.added{color:var(--ok)} .k.removed{color:var(--warn)}
</style>
</head>
<body>
  <div class="top">
    <div class="logo">SF</div>
    <div class="brand">SoundFlow</div>
    <div class="sp"></div>
    <div class="pill" id="status"><span class="dot"></span>Сервер работает</div>
    <div class="addr" id="addr" title="скопировать">—</div>
    <div class="disk" id="disk"></div>
  </div>

  <div class="body">
    <nav class="nav">
      <a class="on">Каталог</a>
      <a onclick="alert('later')">Устройства</a>
      <a onclick="alert('later')">Задачи</a>
      <a onclick="alert('later')">Журнал</a>
      <a onclick="alert('later')">Настройки</a>
      <div class="gap"></div>
      <div class="ver">SoundFlow.exe<br>v0.1 · sqlite</div>
    </nav>

    <div class="main">
      <div class="center">
        <section class="pane">
          <div class="bar">
            <input class="search" id="q" placeholder="Поиск по трекам, артистам, альбомам…" autocomplete="off">
            <button class="btn primary" id="btnScan">Сканировать папку</button>
            <button class="btn" id="btnReindex">Переиндексировать</button>
            <button class="btn danger" id="btnStop">Стоп</button>
          </div>
          <div class="sum" id="sum">загрузка…</div>
          <div class="tree" id="tree"><div class="muted">загрузка каталога…</div></div>
        </section>

        <aside class="side">
          <div class="card">
            <h4>Устройства</h4>
            <div id="devices"><div class="muted" style="padding:6px 0">нет подключённых</div></div>
          </div>
          <div class="card">
            <h4>Задачи</h4>
            <div id="jobs"><div class="muted" style="padding:6px 0">ничего не выполняется</div></div>
          </div>
        </aside>
      </div>

      <div class="log">
        <div class="lh"><span class="dot"></span>Журнал сервера</div>
        <div class="rows" id="log"></div>
      </div>
    </div>
  </div>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s||"").replace(/[<>&]/g, x => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[x]));
const fmtDur = s => { s=s|0; return (s/60|0)+":"+String(s%60).padStart(2,"0"); };
const fmtGB = b => b>0 ? (b/1073741824).toFixed(0)+" ГБ" : "—";
const nfmt = n => (n||0).toLocaleString("ru-RU");

async function jget(u){ const r = await fetch(u); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function jpost(u){ const r = await fetch(u,{method:"POST"}); return r.ok ? r.json() : Promise.reject(await r.text()); }

async function loadInfo(){
  try{
    const d = await jget("/api/info");
    $("#addr").textContent = d.addr;
    $("#disk").textContent = "свободно " + fmtGB(d.disk_free);
    const st = $("#status");
    if(d.has_model){ st.className="pill"; st.innerHTML='<span class="dot"></span>Сервер работает'; }
    else { st.className="pill off"; st.innerHTML='<span class="dot"></span>без модели отпечатков'; }
    $("#sum").innerHTML = `<b>${nfmt(d.tracks)}</b> треков · <b>${nfmt(d.albums)}</b> папок · отпечаток у <b>${nfmt(d.with_vector)}</b>`;
    $("#btnReindex").disabled = !d.has_model || d.with_vector >= d.tracks;
  }catch(e){ $("#status").className="pill off"; }
}

let expanded = new Set();
async function loadCatalog(){
  try{
    const roots = await jget("/api/catalog");
    const box = $("#tree");
    if(!roots.length){ box.innerHTML = '<div class="muted">каталог пуст — нажми «Сканировать папку»</div>'; return; }
    box.innerHTML = "";
    roots.forEach(r => renderNode(box, r, 0));
  }catch(e){ $("#tree").innerHTML = '<div class="muted">ошибка: '+esc(e.message)+'</div>'; }
}
function fpBadge(t,f){
  if(!t) return "";
  if(f>=t) return '<span class="fp full">✓</span>';
  if(f<=0) return '<span class="fp none">—</span>';
  return `<span class="fp part">${f}/${t}</span>`;
}
function renderNode(box, n, depth){
  const key = n.path;
  const open = expanded.has(key) || depth===0;
  const hasKids = (n.children&&n.children.length) || (n.items&&n.items.length);
  const row = document.createElement("div");
  row.className = "row " + (n.kind||"folder");
  row.style.paddingLeft = (10 + depth*16) + "px";
  const ico = n.kind==="root" ? "📁" : (n.kind==="album" ? "💿" : "📁");
  row.innerHTML =
    `<span class="tw">${hasKids ? (open?"▾":"▸") : ""}</span>`+
    `<span class="ico">${ico}</span>`+
    `<span class="nm">${esc(n.name)}</span><span class="sp"></span>`+
    `<span class="meta">${nfmt(n.tracks)} трек.</span>&nbsp;&nbsp;${fpBadge(n.tracks,n.with_fp)}`;
  if(hasKids){
    row.querySelector(".tw").onclick = () => { open?expanded.delete(key):expanded.add(key); loadCatalog(); };
  }
  box.appendChild(row);
  if(!open) return;
  (n.children||[]).forEach(c => renderNode(box, c, depth+1));
  (n.items||[]).forEach(it => {
    const tr = document.createElement("div");
    tr.className = "row track";
    tr.style.paddingLeft = (10 + (depth+1)*16 + 18) + "px";
    tr.innerHTML =
      `<span class="ti">${esc(it.title)}</span>`+
      `<span class="meta">&nbsp;·&nbsp;${esc(it.artist)}</span><span class="sp"></span>`+
      `<span class="meta">${fmtDur(it.duration_sec)}${it.bitrate_kbps?" · "+it.bitrate_kbps:""}</span>`+
      `&nbsp;&nbsp;<span class="${it.has_fp?'yes':'no'}">${it.has_fp?'✓':'—'}</span>`;
    box.appendChild(tr);
  });
}

async function loadSide(){
  try{
    const devs = await jget("/api/devices");
    $("#devices").innerHTML = devs.length ? devs.map(d =>
      `<div class="dev"><div class="ic">📱</div><div><div class="nm">${esc(d.name||d.id)}</div>`+
      `<div class="m">${d.events} событий${d.last_sync_at?" · "+new Date(d.last_sync_at).toLocaleString("ru-RU"):""}</div></div></div>`
    ).join("") : '<div class="muted" style="padding:6px 0">нет подключённых</div>';
  }catch(e){}
  try{
    const jobs = await jget("/api/jobs");
    $("#jobs").innerHTML = jobs.length ? jobs.map(j => {
      const pct = j.total ? Math.min(100, Math.round(j.done*100/j.total)) : (j.running?15:100);
      return `<div class="job"><div class="lbl"><span>${esc(j.label)}</span>`+
        `<span>${j.running ? j.done+"/"+(j.total||"?") : (j.note||"готово")}</span></div>`+
        `<div class="track2"><i style="width:${pct}%"></i></div></div>`;
    }).join("") : '<div class="muted" style="padding:6px 0">ничего не выполняется</div>';
    const anyRun = jobs.some(j=>j.running);
    $("#btnScan").disabled = anyRun;
  }catch(e){}
  try{
    const log = await jget("/api/log?limit=80");
    $("#log").innerHTML = log.map(l =>
      `<div><span class="t">${new Date(l.at).toLocaleTimeString("ru-RU")}</span>&nbsp;&nbsp;`+
      `<span class="k ${esc(l.kind)}">${esc(l.kind)}</span> ${esc(l.detail||(l.artist+" — "+l.title))}</div>`
    ).join("");
  }catch(e){}
}

$("#addr").onclick = () => navigator.clipboard && navigator.clipboard.writeText($("#addr").textContent);
let sTmr;
$("#q").addEventListener("input", () => { clearTimeout(sTmr); sTmr = setTimeout(doSearch, 220); });
async function doSearch(){
  const s = $("#q").value.trim();
  if(!s){ loadCatalog(); return; }
  const rows = await jget("/api/search?q="+encodeURIComponent(s));
  const box = $("#tree");
  box.innerHTML = rows.length ? "" : '<div class="muted">ничего не найдено</div>';
  rows.forEach(t => {
    const tr = document.createElement("div");
    tr.className = "row track"; tr.style.paddingLeft = "14px";
    tr.innerHTML = `<span class="ti">${esc(t.title)}</span><span class="meta">&nbsp;·&nbsp;${esc(t.artist)}${t.album?" · "+esc(t.album):""}</span>`+
      `<span class="sp"></span><span class="meta">${fmtDur(t.duration_sec)}</span>`;
    box.appendChild(tr);
  });
}

$("#btnScan").onclick = async () => {
  let dir = "";
  try{ if(window.go && window.go.main && window.go.main.Service) dir = await window.go.main.Service.PickFolder(); }catch(e){}
  if(!dir) dir = prompt("Путь к папке с музыкой:", "");
  if(!dir) return;
  try{ await fetch("/api/scan?dir="+encodeURIComponent(dir),{method:"POST"}).then(r=>{ if(!r.ok) return r.text().then(t=>Promise.reject(t)); }); }
  catch(e){ alert("Не запустить скан: "+e); }
};
$("#btnReindex").onclick = () => jpost("/api/reindex").catch(e => alert("Переиндексация: "+e));
$("#btnStop").onclick = () => jpost("/api/stop");

function tick(){ loadInfo(); loadSide(); }
loadInfo(); loadCatalog(); loadSide();
setInterval(tick, 2000);
</script>
</body>
</html>
