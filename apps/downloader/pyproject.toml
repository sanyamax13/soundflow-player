[project]
name = "soundflow-downloader"
version = "3.0.0"
description = "SoundFlow — качалка «найти и скачать»: Яндекс, musify, mp3party, торренты"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "mutagen>=1.47.0",
    # qBittorrent Web API — торрент-режим (nnmclub/rutor/tapochek/rustorka).
    "qbittorrent-api>=2026.5.0",
    # yandex-music — неофициальная библиотека (MarshalX) для Yandex.Music API.
    "yandex-music>=2.2,<4",
    # BeautifulSoup — парсинг HTML (musify, чарт-парсеры).
    "beautifulsoup4>=4.12",
    # curl_cffi — TLS-impersonation (Chrome-отпечаток) для musify и торрент-
    # трекеров (обход базового Cloudflare). 0.14.x — здоровая; не поднимать до
    # 0.15+ (битый wheel: OPENSSL invalid library).
    "curl-cffi>=0.14,<0.15",
    # playwright — только parsers/vk_top200.py (чарт VK, для «автоподбора»).
    # Браузер ставится отдельно: `playwright install chromium`.
    "playwright>=1.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.34.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"
